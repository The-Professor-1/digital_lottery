<!DOCTYPE html>
<html lang="am" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#F7F3EB" />
    <meta name="color-scheme" content="light dark" />
    <title>Digital Lottery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before paint to avoid a light/dark flash.
      (function () {
        try {
          var saved = localStorage.getItem('gfj_theme')
          var dark = saved === 'dark'
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
