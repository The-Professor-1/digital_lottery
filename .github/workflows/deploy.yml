name: Deploy Digital Lottery to Google Cloud

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH to the GCP VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.GCP_VM_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/apps/DigitalLottery"
            fi
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "ERROR: .env missing at $APP_DIR/.env"
              echo "Create it from .env.example before deploying."
              exit 1
            fi

            # Bootstrap: the first deploy needs to pull the commit that adds
            # scripts/deploy.sh before it can execute it.
            export GIT_TERMINAL_PROMPT=0
            git fetch origin
            if git show-ref --quiet refs/remotes/origin/main; then
              BRANCH=main
            elif git show-ref --quiet refs/remotes/origin/master; then
              BRANCH=master
            else
              echo "ERROR: neither origin/main nor origin/master exists"
              exit 1
            fi
            git reset --hard "origin/$BRANCH"
            git log -1 --oneline

            bash scripts/deploy.sh
            echo "DigitalLottery deployment completed successfully"
