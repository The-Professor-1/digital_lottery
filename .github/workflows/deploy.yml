name: Deploy Digital Lottery to Google Cloud

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH to the GCP VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.GCP_VM_HOST }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_VM_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.GCP_VM_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="$HOME/apps/DigitalLottery"
            fi
            cd "$APP_DIR"

            if [ ! -f .env ]; then
              echo "ERROR: .env missing at $APP_DIR/.env"
              echo "Create it from .env.example before deploying."
              exit 1
            fi

            bash scripts/deploy.sh
            echo "DigitalLottery deployment completed successfully"
