name: Deploy Digital Lottery

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="$HOME/apps/DigitalLottery"
            cd "$APP_DIR"
            if [ ! -f .env ]; then
              echo "ERROR: .env missing on the server. Create it from .env.example first."
              exit 1
            fi
            bash scripts/deploy.sh
            echo "DigitalLottery deployment completed successfully"
